
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#fff7f0" />
      <title>van-queue-mobile</title>
      <style>
        html, body {
          margin: 0;
          min-height: 100%;
          background:
            radial-gradient(circle at top, rgba(251, 146, 60, 0.18), transparent 36%),
            linear-gradient(180deg, #fff7f0 0%, #fff8f2 48%, #fffdf9 100%);
        }
        body {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #boot-screen {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: grid;
          place-items: center;
          background:
            radial-gradient(circle at top, rgba(251, 146, 60, 0.18), transparent 36%),
            linear-gradient(180deg, #fff7f0 0%, #fff8f2 48%, #fffdf9 100%);
        }
        .boot-card {
          width: min(92vw, 360px);
          padding: 28px;
          border-radius: 28px;
          background: rgba(255, 255, 255, 0.72);
          border: 1px solid rgba(255, 255, 255, 0.8);
          box-shadow: 0 18px 60px rgba(249, 115, 22, 0.18);
          backdrop-filter: blur(18px);
          text-align: center;
        }
        .boot-badge {
          width: 72px;
          height: 72px;
          border-radius: 24px;
          margin: 0 auto 16px;
          display: grid;
          place-items: center;
          color: white;
          font-size: 28px;
          background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
          box-shadow: 0 10px 28px rgba(249, 115, 22, 0.28);
        }
        .boot-dots {
          display: flex;
          justify-content: center;
          gap: 8px;
          margin-top: 18px;
        }
        .boot-dots span {
          width: 10px;
          height: 10px;
          border-radius: 999px;
          background: #fb923c;
          animation: bootPulse 1.1s ease-in-out infinite;
        }
        .boot-dots span:nth-child(2) { animation-delay: 0.15s; }
        .boot-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bootPulse {
          0%, 100% { transform: scale(0.85); opacity: 0.35; }
          50% { transform: scale(1.15); opacity: 1; }
        }
      </style>
    </head>

    <body>
      <div id="boot-screen">
        <div class="boot-card">
          <div class="boot-badge">🚐</div>
          <h1 style="margin: 0; font-size: 28px; color: #9a3412;">TU Van Booking</h1>
          <p style="margin: 8px 0 0; color: #f97316; font-size: 14px;">กำลังโหลดประสบการณ์ของคุณ</p>
          <div class="boot-dots" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
      <div id="root"></div>
      <script src="/runtime-config.js"></script>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
