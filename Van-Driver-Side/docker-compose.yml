services:
  # Backend Service
  driver-backend:
    build: .
    container_name: driver-backend
    working_dir: /app/backend
    command: sh -c "npm install && npm start"
    volumes:
      - .:/app
      - /app/backend/node_modules
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Use the shared DB from the passenger stack (mongo on host:27018)
      - MONGO_URI=mongodb://host.docker.internal:27018/vanbooking?directConnection=true
      - MONGODB_URI=mongodb://host.docker.internal:27018/vanbooking?directConnection=true
      - JWT_SECRET=${JWT_SECRET:-van-queue-secret-key-2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3001,http://localhost:8080}
      - PASSENGER_BASE_URL=${PASSENGER_BASE_URL:-http://localhost:8080}
      - PASSENGER_API_URL=${PASSENGER_API_URL:-http://localhost:4000}
      - DEPARTURE_NOTIFY_SECRET=${DEPARTURE_NOTIFY_SECRET:-change-this-secret}
      - TZ=Asia/Bangkok

  # Frontend Service
  driver-frontend:
    build: .
    container_name: driver-frontend
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    volumes:
      - .:/app
      - /app/frontend/node_modules
    ports:
      - "3001:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
      - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:5000}
    depends_on:
      - driver-backend
